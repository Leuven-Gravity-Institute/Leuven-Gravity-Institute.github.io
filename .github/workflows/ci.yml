name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

# This workflow runs code from pull requests; it needs no write access.
permissions:
    contents: read

jobs:
    test:
        strategy:
            matrix:
                # Latest resolutions run everywhere; the SPEC 0 minimum
                # (lowest-direct) runs on ubuntu with the oldest supported
                # Python, since floor versions predate newer interpreters'
                # wheels.
                python-version: ['3.12', '3.13', '3.14']
                os: [ubuntu-latest, windows-latest, macos-latest]
                resolution: [highest]
                include:
                    - os: ubuntu-latest
                      python-version: '3.12'
                      resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies
              shell: bash
              env:
                  RESOLUTION: ${{ matrix.resolution }}
              run: |
                  if [ "$RESOLUTION" = "lowest-direct" ]; then
                      uv sync --group dev --upgrade --resolution lowest-direct
                  else
                      uv sync --group dev --upgrade
                  fi

            - name: Run tests with pytest
              run: uv run --no-sync pytest

    build:
        # The content must not only validate, it must render.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: 'true'

            - name: Validate content
              run: uv run lgi validate

            - name: Build site
              run: uv run lgi build --output _site
